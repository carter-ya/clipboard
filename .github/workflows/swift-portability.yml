name: Swift Core platforms

on:
  push:
    branches: [main]
    paths:
      - Core/**
      - tools/desktop-ui/check-services.py
      - tools/desktop-ui/check-linux-*
      - tools/desktop-ui/check-x11-*.c
      - .github/workflows/swift-portability.yml
  pull_request:
    paths:
      - Core/**
      - App/**
      - project.yml
      - tools/desktop-ui/check-services.py
      - tools/desktop-ui/check-linux-*
      - tools/desktop-ui/check-x11-*.c
      - .github/workflows/swift-portability.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }} / Swift 6.1.3
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 build and integration-test dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev sway weston wl-clipboard grim seatd libx11-dev libxfixes-dev libdbus-1-dev libsecret-1-dev libtesseract-dev libleptonica-dev tesseract-ocr-eng tesseract-ocr-chi-sim gnome-keyring xvfb xauth xclip dbus-x11 python3-dbus python3-gi
      - name: Install Swift 6.1.3 on Windows
        if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@775d3f4111c5be58a0f62f2efdd353bb8fac15c7
        with:
          swift-version: swift-6.1.3-release
          swift-build: 6.1.3-RELEASE
      - name: Install Swift 6.1.3 on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          swift_dir="$RUNNER_TEMP/swift-6.1.3"
          mkdir -p "$swift_dir"
          curl --fail --location --retry 3 \
            https://download.swift.org/swift-6.1.3-release/ubuntu2204/swift-6.1.3-RELEASE/swift-6.1.3-RELEASE-ubuntu22.04.tar.gz \
            --output "$RUNNER_TEMP/swift.tar.gz"
          tar -xzf "$RUNNER_TEMP/swift.tar.gz" --strip-components=1 -C "$swift_dir"
          test -x "$swift_dir/usr/bin/swift"
          echo "$swift_dir/usr/bin" >> "$GITHUB_PATH"
      - name: Verify selected toolchain
        shell: pwsh
        run: |
          (Get-Command swift).Source | Tee-Object -FilePath toolchain.log
          $SwiftVersionOutput = & swift --version 2>&1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $SwiftVersionOutput | Tee-Object -FilePath toolchain.log -Append
          if (($SwiftVersionOutput -join "`n") -notmatch 'Swift version 6\.1\.3(?:\s|$)') {
            throw "Expected Swift 6.1.3; the selected toolchain does not match."
          }
      - name: Test real core sources
        shell: pwsh
        run: |
          & swift test --package-path Core 2>&1 | Tee-Object -FilePath core-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run synthetic clipboard scenario
        shell: pwsh
        run: |
          & swift run --package-path Core scenario-runner rich-types 2>&1 | Tee-Object -FilePath scenario.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native text clipboard with an independent process
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -eq 'Linux') {
            & xvfb-run --auto-servernum swift run --package-path Core scenario-runner platform-clipboard 2>&1 | Tee-Object -FilePath platform-clipboard.log
          } else {
            & swift run --package-path Core scenario-runner platform-clipboard 2>&1 | Tee-Object -FilePath platform-clipboard.log
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native rich formats and bounded large transfers
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -eq 'Linux') {
            & xvfb-run --auto-servernum swift run --package-path Core scenario-runner platform-rich-clipboard 2>&1 | Tee-Object -FilePath platform-rich.log
          } else {
            & swift run --package-path Core scenario-runner platform-rich-clipboard 2>&1 | Tee-Object -FilePath platform-rich.log
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Wayland receive pipes with a blocking external producer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -pthread -I Core/Sources/CDesktopClipboard/include \
            tools/desktop-ui/check-linux-wayland-pipe.c \
            Core/Sources/CDesktopClipboard/desktop_clipboard.c \
            Core/Sources/CDesktopClipboard/wayland-protocols/*.c \
            $(pkg-config --cflags --libs wayland-client) -lX11 -lXfixes \
            -o "$RUNNER_TEMP/check-linux-wayland-pipe"
          "$RUNNER_TEMP/check-linux-wayland-pipe"
      - name: Verify native Wayland capture and restricted-compositor capabilities
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          binary_dir=$(swift build --package-path Core --show-bin-path)
          dbus-run-session -- /usr/bin/python3 tools/desktop-ui/check-linux-wayland.py --executable "$binary_dir/scenario-runner" --output wayland-sway
          dbus-run-session -- /usr/bin/python3 tools/desktop-ui/check-linux-wayland.py --executable "$binary_dir/scenario-runner" --compositor weston --output wayland-weston
          dbus-run-session -- /usr/bin/python3 tools/desktop-ui/check-linux-portal.py --executable "$binary_dir/scenario-runner" --output platform-portal.json
      - name: Verify secure credentials, startup, local OCR and bounded HTTP
        shell: pwsh
        run: |
          $BinaryDirectory = (& swift build --package-path Core --show-bin-path).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:RUNNER_OS -eq 'Linux') {
            & dbus-run-session -- /usr/bin/python3 tools/desktop-ui/check-services.py --executable (Join-Path $BinaryDirectory 'scenario-runner') --ocr-fixture Core/Fixtures/ocr.png 2>&1 | Tee-Object -FilePath platform-services.log
          } else {
            & python tools/desktop-ui/check-services.py --executable (Join-Path $BinaryDirectory 'scenario-runner.exe') --ocr-fixture Core/Fixtures/ocr.png 2>&1 | Tee-Object -FilePath platform-services.log
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native single-instance activation and owner recovery
        shell: pwsh
        run: |
          & swift run --package-path Core scenario-runner platform-instance 2>&1 | Tee-Object -FilePath platform-instance.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native shortcut ownership and conflict cleanup
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -eq 'Linux') {
            & dbus-run-session -- xvfb-run --auto-servernum swift run --package-path Core scenario-runner platform-shell 2>&1 | Tee-Object -FilePath platform-shell.log
          } else {
            & swift run --package-path Core scenario-runner platform-shell 2>&1 | Tee-Object -FilePath platform-shell.log
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify X11 shortcut event filtering without injecting keys
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -pthread \
            -I Core/Sources/CDesktopShell/include $(pkg-config --cflags dbus-1) \
            tools/desktop-ui/check-x11-shortcut-events.c \
            Core/Sources/CDesktopShell/desktop_portal.c \
            $(pkg-config --libs dbus-1) -lX11 -o "$RUNNER_TEMP/check-x11-shortcut-events"
          "$RUNNER_TEMP/check-x11-shortcut-events"
      - name: Verify Linux tray protocol and actions in a private desktop
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          binary_dir=$(swift build --package-path Core --show-bin-path)
          bash tools/desktop-ui/check-linux-shell.sh --executable "$binary_dir/scenario-runner" --output platform-tray.json
      - name: Verify cancelled X11 requests and error routing
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -pthread \
            -I Core/Sources/CDesktopClipboard/include \
            tools/desktop-ui/check-x11-error-routing.c \
            Core/Sources/CDesktopClipboard/*.c \
            Core/Sources/CDesktopClipboard/wayland-protocols/*.c \
            $(pkg-config --cflags --libs wayland-client) -lX11 -lXfixes -o "$RUNNER_TEMP/check-x11-error-routing"
          xvfb-run -a "$RUNNER_TEMP/check-x11-error-routing"
          peer="$(swift build --package-path Core --show-bin-path)/scenario-runner"
          CLIPBOARD_PRIVATE_X11_TEST=1 xvfb-run -a python3 \
            tools/desktop-ui/check-linux-clipboard-races.py \
            --executable "$peer" --output x11-cancelled-requests
      - name: Upload core test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-tests-${{ matrix.os }}
          path: |
            toolchain.log
            core-tests.log
            scenario.log
            platform-clipboard.log
            platform-rich.log
            platform-services.log
            platform-instance.log
            platform-shell.log
            platform-tray.json
            platform-portal.json
            wayland-*/results.json
            x11-cancelled-requests/
          if-no-files-found: ignore

  macos:
    name: Core and application / macOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test Core and synthetic scenario
        run: |
          set -euo pipefail
          swift --version
          swift test --package-path Core
          swift run --package-path Core scenario-runner rich-types
      - name: Build existing macOS application
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen generate
          xcodebuild -scheme ClipboardApp -destination 'platform=macOS' -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
