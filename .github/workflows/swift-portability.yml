name: Swift core portability experiment

# Validate only when the experiment branch is explicitly pushed, or manually.
# This does not publish an application.
on:
  push:
    branches: [codex/verify-swift-cross-platform]
    paths:
      - Core/**
      - .github/workflows/swift-portability.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }} / Swift 6.1.3
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.1.3
        uses: compnerd/gha-setup-swift@775d3f4111c5be58a0f62f2efdd353bb8fac15c7
        with:
          swift-version: swift-6.1.3-release
          swift-build: 6.1.3-RELEASE
      - name: Show toolchain
        run: swift --version
      - name: Test real core sources
        run: swift test --package-path Core --xunit-output core-tests.xml
      - name: Run synthetic clipboard scenario
        run: swift run --package-path Core scenario-runner rich-types
      - name: Upload core test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-tests-${{ matrix.os }}
          path: core-tests.xml
          if-no-files-found: ignore
