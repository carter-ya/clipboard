name: Desktop UI

on:
  push:
    branches: [main]
    paths:
      - Desktop/**
      - Core/**
      - tools/desktop-ui/**
      - tools/desktop-package/**
      - tools/desktop-pdf/**
      - tools/desktop-image/**
      - tools/desktop-language/**
      - tools/desktop-text/**
      - tools/ci/**
      - .github/actions/swift-build-cache/**
      - .github/workflows/swiftcrossui-preview.yml
  pull_request:
    paths:
      - Desktop/**
      - Core/**
      - tools/desktop-ui/**
      - tools/desktop-package/**
      - tools/desktop-pdf/**
      - tools/desktop-image/**
      - tools/desktop-language/**
      - tools/desktop-text/**
      - tools/ci/**
      - .github/actions/swift-build-cache/**
      - .github/workflows/swiftcrossui-preview.yml
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run complete native UI, real-model and installation acceptance
        type: boolean
        default: true
      platform:
        description: Platform to validate for this manual run
        type: choice
        default: all
        options: [all, windows, linux]
      windows_input_environment:
        description: Inspect/prepare input, browser reference alone, or application with platform Windows
        type: choice
        default: 'off'
        options: ['off', inspect, prepare, browser, application]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FULL_VALIDATION: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_validation) }}
  CHINESE_IME_VALIDATION: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.full_validation || inputs.windows_input_environment == 'application')) }}

permissions:
  contents: read

jobs:
  input-environment:
    if: github.event_name == 'workflow_dispatch' && (inputs.windows_input_environment == 'inspect' || inputs.windows_input_environment == 'prepare' || inputs.windows_input_environment == 'browser')
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect or provision the isolated Windows input environment
        if: inputs.windows_input_environment != 'browser'
        shell: powershell
        env:
          PREPARE_CHINESE_INPUT: ${{ inputs.windows_input_environment == 'prepare' }}
        run: |
          & ./tools/windows-input/probe-environment.ps1 -Prepare:($env:PREPARE_CHINESE_INPUT -eq 'true') -Output input-environment.json
      - name: Exercise the actual Chinese input method in an owned native editor
        if: inputs.windows_input_environment == 'prepare'
        shell: powershell
        run: |
          & ./tools/windows-input/check-native-ime.ps1 -Output ime-receipt.json
      - name: Exercise native browser input without an application build
        if: inputs.windows_input_environment == 'browser'
        shell: powershell
        run: ./tools/desktop-ui/check-windows-browser.ps1 -Output browser-input.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-input-environment
          path: |
            input-environment.json
            ime-receipt.json
            ime-receipt.png
            browser-input.json
          if-no-files-found: error
  preview:
    if: github.event_name != 'workflow_dispatch' || inputs.windows_input_environment == '' || inputs.windows_input_environment == 'off' || inputs.windows_input_environment == 'application'
    name: UI / ${{ matrix.os }} / ${{ matrix.backend }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            github.event_name == 'workflow_dispatch' && inputs.platform == 'windows' &&
              '[{"os":"windows-2022","backend":"GtkBackend","display":"win32","accessibility":"accesskit"}]' ||
            github.event_name == 'workflow_dispatch' && inputs.platform == 'linux' &&
              '[{"os":"ubuntu-22.04","backend":"GtkBackend","display":"x11","accessibility":"atspi"}]' ||
              '[{"os":"ubuntu-22.04","backend":"GtkBackend","display":"x11","accessibility":"atspi"},{"os":"windows-2022","backend":"GtkBackend","display":"win32","accessibility":"accesskit"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 90 }}
    env:
      SCUI_DEFAULT_BACKEND: ${{ matrix.backend }}
      GDK_BACKEND: ${{ matrix.display }}
      GSK_RENDERER: cairo
      GTK_A11Y: ${{ matrix.accessibility }}
      CLIPBOARD_UI_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Provision and verify the actual Windows Chinese input method
        if: runner.os == 'Windows' && env.CHINESE_IME_VALIDATION == 'true'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force ui-artifacts/input | Out-Null
          & ./tools/windows-input/probe-environment.ps1 -Prepare -Output ui-artifacts/input/environment.json
          & ./tools/windows-input/check-native-ime.ps1 -Output ui-artifacts/input/native-ime.json
      - name: Verify CI policy and stable cache identifiers
        if: runner.os == 'Linux'
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python -m unittest discover -s tools/ci -p 'test_*.py' -v
          python tools/desktop-ui/test-input-environment-policy.py
      - name: Verify native browser formats before application builds
        if: runner.os == 'Windows' && env.CHINESE_IME_VALIDATION == 'true'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force ui-artifacts/input | Out-Null
          & ./tools/desktop-ui/check-windows-browser.ps1 -Output ui-artifacts/input/browser.json
      - name: Verify private fixture interpreter and pipe encoding
        shell: pwsh
        run: |
          $FixturePython = (Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          ./tools/desktop-ui/test-private-fixture-python.ps1 -FixturePython $FixturePython
          ./tools/desktop-ui/test-private-fixture-wire.ps1 -FixturePython $FixturePython
          ./tools/desktop-ui/test-private-visible-control-helpers.ps1
          ./tools/desktop-ui/test-private-selection-scope.ps1
          ./tools/desktop-ui/test-private-keyboard-input-types.ps1
          ./tools/desktop-ui/test-private-probe-exit.ps1
      - name: Verify private fixture on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $FixturePython = (Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          ./tools/desktop-ui/test-private-fixture-python.ps1 -FixturePython $FixturePython
          ./tools/desktop-ui/test-private-fixture-wire.ps1 -FixturePython $FixturePython
          ./tools/desktop-ui/test-private-visible-control-helpers.ps1
          ./tools/desktop-ui/test-private-selection-scope.ps1
          ./tools/desktop-ui/test-private-keyboard-input-types.ps1
          ./tools/desktop-ui/test-private-probe-exit.ps1
      - name: Verify private AI fixture response cancellation
        run: python tools/desktop-ui/test-ai-probe-errors.py
      - name: Verify private AI fixture pipe protocol
        run: python tools/desktop-ui/test-ai-probe-server.py
      - name: Install GTK and isolated desktop test tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev sway weston wl-clipboard grim seatd libgtk-4-dev zlib1g-dev pkg-config libx11-dev libxfixes-dev libdbus-1-dev libsecret-1-dev libtesseract-dev libleptonica-dev tesseract-ocr-eng tesseract-ocr-chi-sim gnome-keyring xvfb xauth xclip python3-pyatspi python3-gi at-spi2-core dbus-x11 openbox imagemagick x11-utils fonts-noto-cjk fonts-noto-color-emoji
      - name: Install Swift 6.3.3 on Windows
        if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@775d3f4111c5be58a0f62f2efdd353bb8fac15c7
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      - name: Install Swift 6.3.3 on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          swift_dir="$RUNNER_TEMP/swift-6.3.3"
          mkdir -p "$swift_dir"
          curl --fail --location --retry 3 \
            https://download.swift.org/swift-6.3.3-release/ubuntu2204/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu22.04.tar.gz \
            --output "$RUNNER_TEMP/swift.tar.gz"
          tar -xzf "$RUNNER_TEMP/swift.tar.gz" --strip-components=1 -C "$swift_dir"
          echo "$swift_dir/usr/bin" >> "$GITHUB_PATH"
      - name: Validate native Windows probe definitions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -MTA -ExecutionPolicy Bypass -File tools/desktop-ui/smoke-windows.ps1 -Executable unused -OutputDirectory unused -ValidateOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -MTA -ExecutionPolicy Bypass -File tools/desktop-ui/smoke-windows.ps1 -Executable unused -OutputDirectory unused -ValidateOnly -KeyboardOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore Windows GTK runtime
        if: runner.os == 'Windows'
        id: gtk-cache
        uses: actions/cache/restore@v4
        with:
          path: C:/gtk-build/gtk/x64/release
          key: desktop-gtk4.22.4-accesskit0.18-${{ hashFiles('tools/desktop-ui/install-windows-gtk.ps1', 'tools/desktop-ui/apply-gtk-source-patch.py', 'tools/desktop-ui/gtk-4.22.4-accesskit-actions.patch') }}
      - name: Build Windows GTK with native accessibility
        if: runner.os == 'Windows' && steps.gtk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/desktop-ui/install-windows-gtk.ps1
      - name: Install verified static zlib SDK on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/desktop-ui/install-windows-zlib.ps1 -Prefix (Join-Path $env:RUNNER_TEMP 'clipboard-zlib-sdk')
      - name: Configure Windows GTK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/desktop-ui/install-windows-gtk.ps1 -ConfigureOnly
          python tools/desktop-ui/normalize-windows-pkgconfig.py --prefix C:/gtk-build/gtk/x64/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save Windows GTK runtime
        if: runner.os == 'Windows' && steps.gtk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:/gtk-build/gtk/x64/release
          key: ${{ steps.gtk-cache.outputs.cache-primary-key }}
      - name: Verify toolchain
        shell: pwsh
        run: |
          $VersionOutput = & swift --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $VersionOutput
          if (($VersionOutput -join "`n") -notmatch 'Swift version 6\.3\.3(?:\s|$)') { throw 'Unexpected Swift toolchain' }
      - name: Restore compiled debug dependencies
        id: ui-cache
        uses: ./.github/actions/swift-build-cache
        with:
          package: Desktop
          configuration: debug
      - name: Restore dependency symbolic links on Windows
        if: runner.os == 'Windows' && steps.ui-cache.outputs.cache-matched-key != ''
        shell: pwsh
        run: |
          # Windows cache extraction can leave relative directory links unresolved.
          # Recreate only tracked links from Git, retaining original dependency sources.
          Get-ChildItem Desktop/.build/checkouts -Directory | ForEach-Object {
            $CheckoutDirectory = $_.FullName
            $TrackedEntries = & git -C $CheckoutDirectory ls-files --stage
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($Entry in $TrackedEntries) {
              if ($Entry -match '^120000 [0-9a-f]+ 0\t(.+)$') {
                $LinkPath = $Matches[1]
                & git -C $CheckoutDirectory -c core.symlinks=true checkout-index --force -- $LinkPath
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }
            }
          }
      - name: Verify content validation follows queued saves
        run: python tools/desktop-ui/test-content-validation-order.py
      - name: Verify native input state is restricted to the owned Windows fixture
        run: python tools/desktop-ui/test-ime-state-guard.py
      - name: Build Desktop UI
        shell: pwsh
        run: |
          & python tools/desktop-ui/build-desktop.py --jobs 2 2>&1 | Tee-Object -FilePath ui-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify search submit survives backend updates
        run: python tools/desktop-ui/test-search-submit.py
      - name: Verify Windows executable stack reservation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $BinaryDirectory = (& swift build --package-path Desktop --show-bin-path).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python tools/desktop-ui/check-windows-stack.py --executable (Join-Path $BinaryDirectory 'ClipboardDesktop.exe') --output ui-artifacts/windows-stack.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save compiled debug dependencies before native UI validation
        if: steps.ui-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Desktop/.build
          key: ${{ steps.ui-cache.outputs.key }}
      - name: Check the native Linux window and model consent controls
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          binary_dir=$(swift build --package-path Desktop --configuration debug --show-bin-path)
          dbus-run-session -- xvfb-run --auto-servernum \
            /usr/bin/python3 tools/desktop-ui/smoke-linux.py \
            --executable "$binary_dir/ClipboardDesktop" --model-settings-only --output ui-artifacts/pr-smoke
      - name: Check the native Windows window and model consent controls
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $BinaryDirectory = (& swift build --package-path Desktop --configuration debug --show-bin-path).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -MTA -ExecutionPolicy Bypass -File tools/desktop-ui/smoke-windows.ps1 `
            -Executable (Join-Path $BinaryDirectory 'ClipboardDesktop.exe') -ModelSettingsOnly -OutputDirectory ui-artifacts/pr-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise native Windows keyboard focus and explicit paste
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $BinaryDirectory = (& swift build --package-path Desktop --configuration debug --show-bin-path).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ImeArguments = @()
          if ($env:CHINESE_IME_VALIDATION -eq 'true') { $ImeArguments += @('-ChineseIme', '-BrowserPaste') }
          & powershell.exe -NoProfile -MTA -ExecutionPolicy Bypass -File tools/desktop-ui/smoke-windows.ps1 `
            -Executable (Join-Path $BinaryDirectory 'ClipboardDesktop.exe') -KeyboardOnly -OutputDirectory ui-artifacts/keyboard @ImeArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore compiled release dependencies
        if: (env.FULL_VALIDATION == 'true' || (github.event_name == 'workflow_dispatch' && inputs.windows_input_environment == 'application' && runner.os == 'Windows'))
        id: release-cache
        uses: ./.github/actions/swift-build-cache
        with:
          package: Desktop
          configuration: release
      - name: Restore release dependency symbolic links on Windows
        if: (env.FULL_VALIDATION == 'true' || (github.event_name == 'workflow_dispatch' && inputs.windows_input_environment == 'application' && runner.os == 'Windows')) && runner.os == 'Windows' && steps.release-cache.outputs.cache-matched-key != ''
        shell: pwsh
        run: |
          # Windows cache extraction can leave relative directory links unresolved.
          # Recreate only tracked links from Git, retaining original dependency sources.
          Get-ChildItem Desktop/.build/checkouts -Directory | ForEach-Object {
            $CheckoutDirectory = $_.FullName
            $TrackedEntries = & git -C $CheckoutDirectory ls-files --stage
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($Entry in $TrackedEntries) {
              if ($Entry -match '^120000 [0-9a-f]+ 0\t(.+)$') {
                $LinkPath = $Matches[1]
                & git -C $CheckoutDirectory -c core.symlinks=true checkout-index --force -- $LinkPath
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }
            }
          }
      - name: Build optimized desktop artifacts
        if: (env.FULL_VALIDATION == 'true' || (github.event_name == 'workflow_dispatch' && inputs.windows_input_environment == 'application' && runner.os == 'Windows'))
        shell: pwsh
        run: |
          & python tools/desktop-ui/build-desktop.py --configuration release --jobs 2 2>&1 | Tee-Object -FilePath release-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:RUNNER_OS -eq 'Windows') {
            $ReleaseDirectory = (& swift build --package-path Desktop --configuration release --show-bin-path).Trim()
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & python tools/desktop-ui/check-windows-stack.py --executable (Join-Path $ReleaseDirectory 'ClipboardDesktop.exe') --output ui-artifacts/windows-release-stack.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & swift build --package-path Core --scratch-path Desktop/.build --configuration release --jobs 2 --product scenario-runner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save compiled release dependencies before full acceptance
        if: (env.FULL_VALIDATION == 'true' || (github.event_name == 'workflow_dispatch' && inputs.windows_input_environment == 'application' && runner.os == 'Windows')) && steps.release-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Desktop/.build
          key: ${{ steps.release-cache.outputs.key }}
      - name: Build and exercise Windows keyboard installer
        if: github.event_name == 'workflow_dispatch' && inputs.windows_input_environment == 'application' && env.FULL_VALIDATION != 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          CLIPBOARD_PRIVATE_INSTALL_TEST: '1'
        run: |
          $BinaryDirectory = (& swift build --package-path Desktop --configuration release --show-bin-path).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/desktop-ui/install-windows-gtk.ps1 -ConfigureOnly
          ./tools/desktop-package/build-windows-installer.ps1 -Binary (Join-Path $BinaryDirectory 'ClipboardDesktop.exe') -Output dist
          $Installer = (Get-ChildItem dist/*-setup.exe | Select-Object -First 1).FullName
          ./tools/desktop-package/check-windows-install.ps1 -Installer $Installer -Output ui-artifacts/keyboard-package -Probe tools/desktop-ui/smoke-windows.ps1 -ClipboardPeer (Join-Path $BinaryDirectory 'scenario-runner.exe') -OCRFixture Core/Fixtures/ocr.png -KeyboardOnly -ChineseIme -BrowserPaste
      - name: Exercise GTK window and capture screenshots
        if: env.FULL_VALIDATION == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          binary_dir=$(swift build --package-path Desktop --configuration release --show-bin-path)
          dbus-run-session -- xvfb-run --auto-servernum \
            /usr/bin/python3 tools/desktop-ui/smoke-linux.py \
            --executable "$binary_dir/ClipboardDesktop" --clipboard-peer "$binary_dir/scenario-runner" --ocr-fixture Core/Fixtures/ocr.png --output ui-artifacts
          dbus-run-session -- xvfb-run --auto-servernum \
            /usr/bin/python3 tools/desktop-ui/smoke-linux.py \
            --executable "$binary_dir/ClipboardDesktop" --model-settings-only --output ui-artifacts/local-model-settings
      - name: Exercise native Wayland GTK controls in a private compositor
        if: env.FULL_VALIDATION == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          binary_dir=$(swift build --package-path Desktop --configuration release --show-bin-path)
          dbus-run-session -- /usr/bin/python3 tools/desktop-ui/check-linux-wayland.py \
            --executable "$binary_dir/scenario-runner" --ui-executable "$binary_dir/ClipboardDesktop" --output ui-artifacts/wayland-sway
          dbus-run-session -- /usr/bin/python3 tools/desktop-ui/check-linux-wayland.py \
            --executable "$binary_dir/scenario-runner" --ui-executable "$binary_dir/ClipboardDesktop" --copy-only --output ui-artifacts/wayland-copy-only
      - name: Exercise Windows GTK window and capture screenshots
        if: env.FULL_VALIDATION == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $BinaryDirectory = (& swift build --package-path Desktop --configuration release --show-bin-path).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -MTA -ExecutionPolicy Bypass -File tools/desktop-ui/smoke-windows.ps1 `
            -Executable (Join-Path $BinaryDirectory 'ClipboardDesktop.exe') -ClipboardPeer (Join-Path $BinaryDirectory 'scenario-runner.exe') -OCRFixture Core/Fixtures/ocr.png -OutputDirectory ui-artifacts
          $UiExitCode = $LASTEXITCODE
          if ($UiExitCode -ne 0) {
            # Diagnose a minimal native scene, preserving the full preview's failure.
            & powershell.exe -NoProfile -MTA -ExecutionPolicy Bypass -File tools/desktop-ui/smoke-windows.ps1 `
              -Executable (Join-Path $BinaryDirectory 'ClipboardDesktop.exe') -OutputDirectory ui-artifacts/baseline -Baseline
            exit $UiExitCode
          }
          & powershell.exe -NoProfile -MTA -ExecutionPolicy Bypass -File tools/desktop-ui/smoke-windows.ps1 `
            -Executable (Join-Path $BinaryDirectory 'ClipboardDesktop.exe') -ModelSettingsOnly -OutputDirectory ui-artifacts/local-model-settings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare pinned optional models outside application and artifact caches
        if: env.FULL_VALIDATION == 'true'
        shell: pwsh
        run: |
          $BinaryDirectory = (& swift build --package-path Desktop --configuration release --show-bin-path).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ModelCache = Join-Path $env:RUNNER_TEMP 'clipboard-optional-model-fixtures'
          & python tools/desktop-language/build-worker.py --output $BinaryDirectory --cache $ModelCache --download-test-model-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python tools/desktop-text/build-worker.py --output $BinaryDirectory --cache $ModelCache --download-test-model-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $SummaryDefinition = Get-Content -Raw Core/Sources/ClipboardCore/Resources/DesktopLocalLanguageModel.json | ConvertFrom-Json
          $EntityDefinition = Get-Content -Raw Core/Sources/ClipboardCore/Resources/DesktopLocalEntityModel.json | ConvertFrom-Json
          $SummaryPath = Join-Path $ModelCache ($SummaryDefinition.sha256.Substring(0, 16) + '-' + $SummaryDefinition.filename)
          $EntityPath = Join-Path $ModelCache ($EntityDefinition.sha256.Substring(0, 16) + '-' + $EntityDefinition.filename)
          "CLIPBOARD_TEST_MODEL_CACHE=$ModelCache" >> $env:GITHUB_ENV
          "CLIPBOARD_TEST_SUMMARY_MODEL=$SummaryPath" >> $env:GITHUB_ENV
          "CLIPBOARD_TEST_ENTITY_MODEL=$EntityPath" >> $env:GITHUB_ENV
          & python tools/desktop-ui/check-model-fixture-preparation.py --summary-model $SummaryPath --entity-model $EntityPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise actual local models through native Windows controls
        if: env.FULL_VALIDATION == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $BinaryDirectory = (& swift build --package-path Desktop --configuration release --show-bin-path).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -MTA -ExecutionPolicy Bypass -File tools/desktop-ui/smoke-windows.ps1 `
            -Executable (Join-Path $BinaryDirectory 'ClipboardDesktop.exe') -ClipboardPeer (Join-Path $BinaryDirectory 'scenario-runner.exe') `
            -LocalTextOnly -SummaryModel $env:CLIPBOARD_TEST_SUMMARY_MODEL -EntityModel $env:CLIPBOARD_TEST_ENTITY_MODEL `
            -ModelDefinitions Core/Sources/ClipboardCore/Resources -OutputDirectory ui-artifacts/local-text
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise model import cancellation and repair through native Windows controls
        if: env.FULL_VALIDATION == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $BinaryDirectory = (& swift build --package-path Desktop --configuration release --show-bin-path).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -MTA -ExecutionPolicy Bypass -File tools/desktop-ui/smoke-windows.ps1 `
            -Executable (Join-Path $BinaryDirectory 'ClipboardDesktop.exe') `
            -ModelOperationsOnly -SummaryModel $env:CLIPBOARD_TEST_SUMMARY_MODEL -EntityModel $env:CLIPBOARD_TEST_ENTITY_MODEL `
            -ModelDefinitions Core/Sources/ClipboardCore/Resources -OutputDirectory ui-artifacts/model-operations
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise actual file and PDF models through native Windows controls
        if: env.FULL_VALIDATION == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $BinaryDirectory = (& swift build --package-path Desktop --configuration release --show-bin-path).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -MTA -ExecutionPolicy Bypass -File tools/desktop-ui/smoke-windows.ps1 `
            -Executable (Join-Path $BinaryDirectory 'ClipboardDesktop.exe') -ClipboardPeer (Join-Path $BinaryDirectory 'scenario-runner.exe') `
            -LocalFileModelsOnly -SummaryModel $env:CLIPBOARD_TEST_SUMMARY_MODEL -EntityModel $env:CLIPBOARD_TEST_ENTITY_MODEL `
            -ModelDefinitions Core/Sources/ClipboardCore/Resources -OutputDirectory ui-artifacts/local-file-models
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Linux runtime and verify installation without a Swift SDK
        if: env.FULL_VALIDATION == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends patchelf
          binary_dir=$(swift build --package-path Desktop --configuration release --show-bin-path)
          python3 tools/desktop-package/package-desktop.py --binary "$binary_dir/ClipboardDesktop" --platform linux --output dist
          package_dir=$(find dist -mindepth 1 -maxdepth 1 -type d -name 'ClipboardDesktop-*-linux-*' -print -quit)
          package_name=$(basename "$package_dir")
          docker build -t clipboard-runtime-fixture -f tools/desktop-package/linux-runtime.Dockerfile .
          mkdir -p ui-artifacts/package
          docker run --rm --init --network none -v "$PWD/dist:/packages:ro" -v "$PWD/tools/desktop-ui:/probes:ro" -v "$PWD/tools/desktop-package:/checks:ro" -v "$PWD/ui-artifacts/package:/reports" -v "$binary_dir/scenario-runner:/reference-peer:ro" -v "$PWD/Core/Fixtures/ocr.png:/ocr-fixture.png:ro" -v "$CLIPBOARD_TEST_MODEL_CACHE:/model-cache" -v "$PWD/Core/Sources/ClipboardCore/Resources:/model-definitions:ro" clipboard-runtime-fixture \
            /usr/bin/python3 /checks/check-linux-install.py --package "/packages/$package_name" --probe /probes/smoke-linux.py --clipboard-peer /reference-peer --ocr-fixture /ocr-fixture.png --summary-model "/model-cache/$(basename "$CLIPBOARD_TEST_SUMMARY_MODEL")" --entity-model "/model-cache/$(basename "$CLIPBOARD_TEST_ENTITY_MODEL")" --model-definitions /model-definitions --output /reports/installation
          docker run --rm --init --network none -v "$PWD/dist:/packages:ro" -v "$PWD/tools/desktop-ui:/probes:ro" -v "$PWD/ui-artifacts/package:/reports" -v "$PWD/Core/Sources/ClipboardCore/Resources:/model-definitions:ro" clipboard-runtime-fixture \
            dbus-run-session -- xvfb-run -a /usr/bin/python3 /probes/check-system-language-linux.py --package "/packages/$package_name" --catalog /model-definitions/DesktopStrings.json --output /reports/system-language
          for scale in 1 2; do
            docker run --rm --init --network none -v "$PWD/dist:/packages:ro" -v "$PWD/tools/desktop-ui:/probes:ro" -v "$PWD/ui-artifacts/package:/reports" clipboard-runtime-fixture \
              dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1440x24' /usr/bin/python3 /probes/check-linux-layout.py \
              --executable "/packages/$package_name/bin/ClipboardDesktop" --scale "$scale" --output "/reports/scale-$scale"
          done
      - name: Build and exercise Windows user installer
        if: env.FULL_VALIDATION == 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          CLIPBOARD_PRIVATE_INSTALL_TEST: '1'
        run: |
          $BinaryDirectory = (& swift build --package-path Desktop --configuration release --show-bin-path).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/desktop-ui/install-windows-gtk.ps1 -ConfigureOnly
          ./tools/desktop-package/build-windows-installer.ps1 -Binary (Join-Path $BinaryDirectory 'ClipboardDesktop.exe') -Output dist
          $Installer = (Get-ChildItem dist/*-setup.exe | Select-Object -First 1).FullName
          ./tools/desktop-package/check-windows-install.ps1 -Installer $Installer -Output ui-artifacts/package -Probe tools/desktop-ui/smoke-windows.ps1 -ClipboardPeer (Join-Path $BinaryDirectory 'scenario-runner.exe') -OCRFixture Core/Fixtures/ocr.png -SummaryModel $env:CLIPBOARD_TEST_SUMMARY_MODEL -EntityModel $env:CLIPBOARD_TEST_ENTITY_MODEL -ModelDefinitions Core/Sources/ClipboardCore/Resources -ChineseIme -BrowserPaste
      - name: Upload installable previews and checksums
        if: env.FULL_VALIDATION == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-desktop-preview-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Upload screenshots and UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftcrossui-${{ matrix.os }}
          path: |
            ui-build.log
            release-build.log
            ui-artifacts
          if-no-files-found: ignore
